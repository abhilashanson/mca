<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  body {
    background-image: url('oip.png');
    background-repeat: no-repeat;
    background-position: center;
  }
  
  nav {
    background-color: #1f2937; 
    display: flex;         
    gap: 50px;                 
    padding: 10px 20px;        
    align-items: center;
  }

  nav a {
    color: #ffffff;            
    text-decoration: none;   
    font-size: 20px;         
    font-weight: 500;
    padding: 8px 12px;       
    border-radius: 4px;      
  }
  h1 {
    color: #1f2937;
    margin-top: 30px;
    text-align: center;
  }

  .gallery-container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .gallery-item {
    background-color: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
  }

  .gallery-item img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<nav>
  <a href="home.html">Home</a>
</nav>

<h1>Gallery</h1>

<div class="gallery-container">
  <div class="gallery-grid">
    <div class="gallery-item"><img src="G1.jpg" alt="Gallery image 1"></div>
    <div class="gallery-item"><img src="G2.jpg" alt="Gallery image 2"></div>
    <div class="gallery-item"><img src="G3.jpg" alt="Gallery image 3"></div>
    <div class="gallery-item"><img src="G4.jpg" alt="Gallery image 4"></div>
    <div class="gallery-item"><img src="G5.jpg" alt="Gallery image 5"></div>
    <div class="gallery-item"><img src="G6.jpg" alt="Gallery image 6"></div>
    <div class="gallery-item"><img src="G7.jpg" alt="Gallery image 7"></div>
    <div class="gallery-item"><img src="G8.jpg" alt="Gallery image 8"></div>
    <div class="gallery-item"><img src="G9.jpg" alt="Gallery image 9"></div>
    <div class="gallery-item"><img src="G10.jpg" alt="Gallery image 10"></div>
    <div class="gallery-item"><img src="G11.jpg" alt="Gallery image 11"></div>
    <div class="gallery-item"><img src="G12.jpg" alt="Gallery image 12"></div>
  </div>
</div>

</body>
</html>
